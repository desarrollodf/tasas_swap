name: Actualizar datos

on:
  workflow_dispatch:

  schedule:
    - cron: '0 8 * * 1-5'
      timezone: 'America/Santiago'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar datos
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASSWORD: ${{ secrets.BCCH_PASSWORD }}
        run: python actualizar_datos.py

      - name: Guardar datos actualizados
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos.xlsx

          if git diff --cached --quiet; then
            echo 'No hay cambios en datos.xlsx'
          else
            git commit -m 'Actualizar datos automaticamente'
            git push origin main
          fi